# 规则集合
rule-anchor:
  local: &local {type: file, behavior: classical, format: text}
  classical: &classical {type: http, behavior: classical, format: text, interval: *Time}
  ip: &ip {type: http, behavior: ipcidr, format: mrs, interval: *Time}
  domain: &domain {type: http, behavior: domain, format: mrs, interval: *Time}
  domain_text: &domain_text {type: http, behavior: domain, format: text, interval: *Time}
rule-providers:
  # 用户自定义直连
  classical_user_direct:
    <<: *local
    path: "./rule_provider/classical_user_direct.list"
  # 白名单
  classical_whitelist_proxy:
    <<: *local
    path: "./rule_provider/classical_whitelist_proxy.list"
  # 黑名单
  classical_blacklist_direct:
    <<: *local
    path: "./rule_provider/classical_blacklist_direct.list"
  # 自定义直连
  domain_custom_direct:
    <<: *domain
    url: "https://raw.githubusercontent.com/5MayRain/Rule/main/Mihomo/domain_direct.mrs"
    path: "./rule_provider/domain_custom_direct.mrs"
  # 自定义代理
  domain_custom_proxy:
    <<: *domain
    url: "https://raw.githubusercontent.com/5MayRain/Rule/main/Mihomo/domain_proxy.mrs" 
    path: "./rule_provider/domain_custom_proxy.mrs"
  # 自定义拦截
