# HTTP(S) 和 SOCKS 代理混合端口
mixed-port: 7890
# 透明代理端口，用于 Linux 和 MacOS
redir-port: 7891
# Linux的透明代理服务器端口（TCP和UDP）
tproxy-port: 1536
# 允许局域网连接
allow-lan: true
# 绑定 IP 地址，仅作用于 allow-lan 为 true，'*'表示所有地址
bind-address: "*"
# 代理模式 rule(规则匹配)、 global(全局代理)、 direct(全局直连)
mode: rule
# 日志级别 silent(静默)/error(仅输出发生错误至无法使用的日志)/warning(输出发生错误但不影响运行的日志)/info(输出一般运行的内容)/debug(尽可能的输出运行中所有的信息)
log-level: silent
# 开启 IPv6 总开关，关闭阻断所有 IPv6 链接和屏蔽 DNS 请求 AAAA 记录
ipv6: true
# 禁用 TCP Keep Alive
disable-keep-alive: true
# 进程匹配模式
find-process-mode: always
# 更新时间
updatetime: &Time 86400

# API 监听地址
external-controller: 0.0.0.0:9090
# API 访问密钥
secret: ""
# 配置 WEB UI 目录
external-ui: "webui/zashboard"
# WEB UI 下载地址
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip"

## 缓存
profile:
  # 储存策略组的选择
  store-selected: true
  # 持久化 fake-ip
  store-fake-ip: true
# TCP 并发
tcp-concurrent: true
# 统一延迟时
unified-delay: true

# GEOIP 数据模式
geodata-mode: false
#自定 GEO 下载地址
geox-url:
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
# 自动更新 GEO
geo-auto-update: true
# 更新间隔，单位：小时
geo-update-interval: 24

# 实验
experimental:
  http-headers:
    request:
      - name: "User-Agent"
        value: "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Mobile Safari/537.36"
      - name: "Accept-Language"
        value: "en-US,en;q=0.9"

# 健康检查
p: &p
  type: http
  interval: *Time
  health-check:
    enable: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
  proxy: 🔄 订阅更新
  header:
    User-Agent:
      - "ClashMetaForAndroid/2.11.2.Meta"
      - "clash-verge/v2.2.3"
      - "ClashforWindows/0.19.23"
      - "clash.meta"
      - "mihomo"
  exclude-filter: "套餐|重置|剩余|到期|订阅|群|账户|流量|有效期|时间|官网|失联|余额|分享|免翻|邀请|地址"

# 订阅地址
A: &A
  use:

All: &All
  type: url-test
  use:

# 代理集合
proxy-providers:

# hosts
hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6, 2400:3200::1, 2400:3200:baba::1]
  doh.pub: [1.12.12.12, 120.53.53.53]
  dns.cloudflare.com: [1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001]
  dns.google: [8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844]
  services.googleapis.cn: services.googleapis.com
  cn.bing.com: global.bing.com

# DNS 配置
dns:
  enable: true
  # 解析 IPV6
  ipv6: true
  # DNS 处理模式
  enhanced-mode: fake-ip
  #  IP 段设置
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::/48
  # DNS 服务监听
  listen: 0.0.0.0:1053
  # 过滤
  fake-ip-filter:
    - "RULE-SET:domain_cn"
    - "RULE-SET:domain_Private"
    - "RULE-SET:domain_GoogleFCM"
    - "RULE-SET:fakeip-filter"
    - "RULE-SET:domain_custom_direct"
    - "RULE-SET:classical_user_direct"
  # 用于 direct 出口域名解析的 DNS 服务器
  direct-nameserver:
    #- 127.0.0.1:3721
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 代理节点域名解析服务器
  proxy-server-nameserver:
    #- 127.0.0.1:3721
    - https://doh.pub/dns-query#🛰️ 全球直连&h3=false
    - https://dns.alidns.com/dns-query#🛰️ 全球直连&h3=true
  # 指定域名查询的解析服务器
  nameserver-policy:
    "RULE-SET:domain_cn,domain_Microsoft,domain_Apple,domain_custom_direct,classical_user_direct":
      #- 127.0.0.1:3721
      - https://doh.pub/dns-query#🛰️ 全球直连&h3=false
      - https://dns.alidns.com/dns-query#🛰️ 全球直连&h3=true
  # 默认的域名解析服务器
  nameserver:
    - https://dns.google/dns-query#🌐 DNS连接&h3=true
    - https://dns.cloudflare.com/dns-query#🌐 DNS连接&h3=true

# 域名嗅探
sniffer:
  # 启用
  enable: true
  # 对 redir-host 类型识别的流量进行强制嗅探
  force-dns-mapping: true
  # 对所有未获取到域名的流量进行强制嗅探
  parse-pure-ip: true
  # 使用嗅探结果作为实际访问
  override-destination: true
  # 嗅探的协议设置
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]
  # 强制嗅探
  force-domain:
    - "+.v2ex.com"
  # 跳过嗅探
  skip-domain:
    - "Mijia Cloud"
    
# Tun 网卡
tun:
  enable: true
  # 模式堆栈
  stack: gvisor
  # 网卡名称
  device: Meta
  # 自动设置全局路由
  auto-route: true
  # 自动配置 iptables/nftables
  auto-redirect: false
  # 自动选择流量出口接口
  auto-detect-interface: true
  # dns 劫持
  dns-hijack: 
    - any:53
    - tcp://any:53
  # 执行严格的路由规则
  strict-route: true
  # UDP NAT 过期时间
  udp-timeout: 300
  # 启用独立于端点的 NAT
  endpoint-independent-nat: true
  # 禁用 ICMP 转发
  # disable-icmp-forwarding: true

# 代理
proxies:
  - {name: 🇨🇳 国内, type: direct, udp: true}
  - {name: ⛔️ 拒绝连接, type: reject}
  - {name: 🌐 DNS劫持, type: dns}

