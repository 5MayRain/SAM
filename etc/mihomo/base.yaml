# 规则集合
rule-anchor:
  local: &local {type: file, behavior: classical, format: text}
  classical: &classical {type: http, behavior: classical, format: text, interval: *Time}
  ip: &ip {type: http, behavior: ipcidr, format: mrs, interval: *Time}
  domain: &domain {type: http, behavior: domain, format: mrs, interval: *Time}
  
rule-providers:
  # 用户自定义
  Classical_User_Direct:
    <<: *local
    path: "./rule_provider/Classical_User_Direct.list"
  Classical_User_Proxy:
    <<: *local
    path: "./rule_provider/Classical_User_Proxy.list"
  Classical_User_Reject:
    <<: *local
    path: "./rule_provider/Classical_User_Reject.list"

  # 局域网
  Domain_Lan:
    <<: *domain
    url: "https://github.com/5MayRain/rule/raw/main/rule/Mihomo/Lan/Domain_Lan.mrs"
    path: "./rule_provider/Domain_Lan.mrs"
  IP_Lan:
