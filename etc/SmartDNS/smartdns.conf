# DNS 服务器监听的 IP 和端口，支持监听多个 IP 和端口
bind 127.0.0.1:3721

# Bootstrap 服务器
server https://223.5.5.5/dns-query -bootstrap-dns -exclude-default-group
server https://223.6.6.6/dns-query -bootstrap-dns -exclude-default-group
server https://1.12.12.12/dns-query -bootstrap-dns -exclude-default-group
server https://120.53.53.53/dns-query -bootstrap-dns -exclude-default-group

#上游服务器
server https://dns.alidns.com/dns-query
server https://doh.pub/dns-query
server https://doh.360.cn/dns-query

# DNS 缓存大小
# 0 表示无缓存，-1表示根据内存大小自动调整
cache-size 1048576

# 域名预读
prefetch-domain yes

# 乐观缓存
serve-expired yes

# DNS 缓存持久化
cache-persist yes
cache-file data/smartdns.cache
cache-checkpoint-time 3600

# 响应过期请求时使用的 TTL 值
serve-expired-reply-ttl 5

# 速度检查模式
speed-check-mode ping,tcp:80,tcp:443

# 响应模式（first-ping|fastest-ip|fastest-response）
response-mode first-ping

# 双栈 IP 优选
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15

# 所有资源记录的 TTL
rr-ttl-min 5
rr-ttl-max 86400
rr-ttl-reply-max 86400

# 日志配置
log-level error
log-file ../../tmp/smartdns.log
log-size 512k
log-num 1

# 数据目录
data-dir data

# WebUI
plugin smartdns_ui.so
smartdns-ui.www-root wwwroot
smartdns-ui.ip http://127.0.0.1:6080
smartdns-ui.token-expire 600
smartdns-ui.max-query-log-age 86400
smartdns-ui.enable-terminal no
smartdns-ui.enable-cors yes
smartdns-ui.user root
smartdns-ui.password root