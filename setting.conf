# AdGuardHome DNS
# 启用/禁用(true/false)
AGH_ENABLE=true

# AdGuardHome 端口
AGH_DNS_PORT=5300

# 阻断 ipv6 的 DNS 请求
# 启用/禁用(true/false)
BLOCK_IPV6_DNS=true

# SmartDNS
# 启用/禁用(true/false)
SMARTDNS_ENABLE=false

# Tun 网卡
TUN_DEVICE=Meta

# Mihomo DNS 端口
MIHOMO_DNS_PORT=1053

# Mihomo ipv6 代理 
# 启用/禁用(true/false)
MIHOMO_IPV6=true

# 使用 iptables 拦截 ip
# 启用/禁用(true/false)
IP_IPTABLES=false

# host
# 启用/禁用(true/false)
HOST_ENABLE=true

# 定时执行 启用/禁用(true/false)
# 配置路径: /data/adb/modules/SAM/etc/crontabs/root
CRONTAB_ENABLE=false

# Mihomo配置卸载备份 启用/禁用(true/false)
# 存放路径: /sdcard/Mihomo配置.yaml
BACKUP_CONF=true

# 节点订阅地址
# 注意: 地址要用双引号，每个地址之间用空格隔离开来，无订阅则无法启动服务
# 示例: SUB_URL=("订阅地址1" "订阅地址2" "订阅地址3")
SUB_URL=()

# 白名单/黑名单
# 启用/禁用(true/false)
# 启用则使用白名单，禁用则使用黑名单，两者无法同时使用
# 白名单配置路径: /data/adb/modules/SAM/etc/app_whitelist.prop
# 黑名单配置路径: /data/adb/modules/SAM/etc/app_blacklist.prop
ENABLE_WHITELIST=false

# 黑名单WIFI
# 将 WIFI 名称填入，检测到当前所连接 WIFI 有在名单内将停止服务，断开WIFI或连接不在名单内的WIFI，将启动服务
# 注意: WIFI名要用双引号，每个WIFI名之间用空格隔离开来，无内容则无法启动监控
BLACKLIST_WIFI=()
